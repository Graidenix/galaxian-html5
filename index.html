<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galaxian</title>
    <style>
        @font-face {
            font-family: NES;
            src: url(/assets/fonts/PressStart2P.ttf);
        }

        :root {
            --bg: #000;
            --frame: #ccc;
            --key-face: #1b1b2a;
            --key-edge: #4a4a6a;
            --key-text: #fff;
            --label: #ff3b30;       /* palette red, as in the HUD */
            --active: #ffd60a;      /* palette yellow, as the ship's bullet */
            --hint: #8a8aa8;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 100vh;
            padding: 16px;
            box-sizing: border-box;
            font-family: NES, ui-monospace, monospace;
        }

        canvas {
            display: block;
            width: 640px;
            max-width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            border: 3px inset var(--frame);
            image-rendering: pixelated;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px 22px;
            width: 646px;
            max-width: 100%;
            user-select: none;
            -webkit-user-select: none;
        }

        .legend-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-label {
            color: var(--label);
            font-size: 10px;
            margin-right: 4px;
            letter-spacing: 1px;
        }

        .key {
            min-width: 34px;
            height: 34px;
            padding: 0 8px;
            border: 2px solid var(--key-edge);
            border-radius: 6px;
            background: var(--key-face);
            color: var(--key-text);
            font: 10px NES, ui-monospace, monospace;
            box-shadow: 0 4px 0 var(--key-edge);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 60ms, box-shadow 60ms, color 60ms, border-color 60ms;
        }

        .key.arrow {
            font-family: ui-monospace, monospace;
            font-size: 16px;
            font-weight: bold;
        }

        .key:hover {
            border-color: var(--hint);
        }

        .key.is-down {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--key-edge);
        }

        .key[aria-pressed="true"] {
            color: var(--active);
            border-color: var(--active);
            box-shadow: 0 4px 0 #8a6d00;
        }

        .key[aria-pressed="true"].is-down {
            box-shadow: 0 1px 0 #8a6d00;
        }

        .key:focus-visible {
            outline: 2px solid var(--active);
            outline-offset: 2px;
        }

        .legend-hint {
            width: 100%;
            text-align: center;
            color: var(--hint);
            font-size: 8px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <canvas id="screen" width="640" height="480"></canvas>

    <nav id="legend" class="legend" aria-label="Game controls">
        <div class="legend-group">
            <span class="legend-label">MOVE</span>
            <button type="button" class="key arrow" data-code="ArrowLeft" aria-label="Move left">←</button>
            <button type="button" class="key arrow" data-code="ArrowRight" aria-label="Move right">→</button>
        </div>
        <div class="legend-group">
            <span class="legend-label">FIRE</span>
            <button type="button" class="key" data-code="Space" aria-label="Fire">SPACE</button>
        </div>
        <div class="legend-group">
            <span class="legend-label">MENU</span>
            <button type="button" class="key arrow" data-code="ArrowUp" aria-label="Menu up">↑</button>
            <button type="button" class="key arrow" data-code="ArrowDown" aria-label="Menu down">↓</button>
        </div>
        <div class="legend-group">
            <span class="legend-label">START</span>
            <button type="button" class="key" data-code="Enter" aria-label="Start">ENTER</button>
        </div>
        <div class="legend-group">
            <span class="legend-label">PAUSE</span>
            <button type="button" class="key" data-code="Escape" aria-label="Pause" aria-pressed="false">ESC</button>
        </div>
        <div class="legend-group">
            <span class="legend-label">MUTE</span>
            <button type="button" class="key" data-code="KeyM" aria-label="Mute" aria-pressed="false">M</button>
        </div>
        <p class="legend-hint">WASD WORKS TOO · CLICK OR TAP THE KEYS TO PLAY</p>
    </nav>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
