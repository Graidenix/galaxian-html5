<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Galaxian</title>
    <meta name="description" content="A browser remake of Namco's 1979 arcade classic. Dodge diving aliens and their bombs, and clear the swarm. Play with the keyboard, or with the NES-style pad on a phone.">
    <link rel="canonical" href="https://galaxian.odajiu.eu/">

    <!-- OpenGraph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Galaxian HTML5">
    <meta property="og:title" content="Galaxian: the 1979 arcade classic in your browser">
    <meta property="og:description" content="Aliens break formation, dive at your ship and drop bombs. A pixel-faithful HTML5 remake of Namco's Galaxian. Play free in the browser.">
    <meta property="og:url" content="https://galaxian.odajiu.eu/">
    <meta property="og:image" content="https://galaxian.odajiu.eu/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Galaxian gameplay: the alien formation above the player's ship while a purple alien dives and drops a bomb">
    <meta property="og:locale" content="en_US">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Galaxian: the 1979 arcade classic in your browser">
    <meta name="twitter:description" content="Aliens break formation, dive at your ship and drop bombs. A pixel-faithful HTML5 remake of Namco's Galaxian.">
    <meta name="twitter:image" content="https://galaxian.odajiu.eu/og-image.png">
    <meta name="twitter:image:alt" content="Galaxian gameplay: the alien formation above the player's ship while a purple alien dives and drops a bomb">

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <style>
        @font-face {
            font-family: NES;
            src: url(/assets/fonts/PressStart2P.ttf);
        }

        :root {
            --bg: #000;
            --frame: #ccc;
            --key-face: #1b1b2a;
            --key-edge: #4a4a6a;
            --key-text: #fff;
            --label: #ff3b30;       /* palette red, as in the HUD */
            --active: #ffd60a;      /* palette yellow, as the ship's bullet */
            --hint: #8a8aa8;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 100vh;
            padding: 16px;
            box-sizing: border-box;
            font-family: NES, ui-monospace, monospace;
            /* No double-tap zoom (iOS ignores user-scalable=no for that). */
            touch-action: manipulation;
        }

        .screen {
            position: relative;
            width: 646px;
            max-width: 100%;
        }

        canvas {
            display: block;
            /* Content box is exactly 4:3, so pixels scale evenly (1× = 640×480, 2× = 1280×960). */
            width: calc(100% - 6px);
            height: auto;
            aspect-ratio: 4 / 3;
            border: 3px inset var(--frame);
            image-rendering: pixelated;
        }

        /* 2 toggles 2× size: same 640×480 canvas, each pixel drawn 2×2. Capped to the viewport width. */
        .screen.x2 {
            width: 1286px;
        }

        /* Default "tube" look: rounded glass, halo glow, glare and vignette. Overlays sit inside the 3px border. */
        .screen canvas {
            border-radius: 22px / 18px;
            box-shadow: 0 0 40px rgba(90, 160, 255, 0.25);
        }

        .screen::before,
        .screen::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: 20px / 16px;
            pointer-events: none;
            z-index: 1; /* above the canvas, which becomes its own layer when the CRT filter applies */
        }

        .screen::after {
            background:
                radial-gradient(ellipse at 50% 35%, rgba(255, 255, 255, 0.06), transparent 45%),
                radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, 0.6) 100%);
        }

        /* Easter egg: C toggles CRT phosphor + vertical scanlines (the original monitor was mounted rotated 90°). */
        .screen.crt canvas {
            filter: saturate(1.3) contrast(1.15) brightness(1.2) blur(0.35px) drop-shadow(0 0 3px rgba(255, 255, 255, 0.25));
        }

        .screen.crt::before {
            background: repeating-linear-gradient(to right, rgba(0, 0, 0, 0.5) 0 1px, transparent 1px 2px);
        }

        .screen.crt::after {
            animation: crt-flicker 0.12s infinite alternate;
        }

        @keyframes crt-flicker {
            from { opacity: 0.94; }
            to { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .screen.crt::after { animation: none; }
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px 22px;
            width: 646px;
            max-width: 100%;
            user-select: none;
            -webkit-user-select: none;
        }

        .legend-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-label {
            color: var(--label);
            font-size: 10px;
            margin-right: 4px;
            letter-spacing: 1px;
        }

        .key {
            min-width: 34px;
            height: 34px;
            padding: 0 8px;
            border: 2px solid var(--key-edge);
            border-radius: 6px;
            background: var(--key-face);
            color: var(--key-text);
            font: 10px NES, ui-monospace, monospace;
            box-shadow: 0 4px 0 var(--key-edge);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 60ms, box-shadow 60ms, color 60ms, border-color 60ms;
        }

        .key.arrow {
            font-family: ui-monospace, monospace;
            font-size: 16px;
            font-weight: bold;
        }

        .key:hover {
            border-color: var(--hint);
        }

        .key.is-down {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--key-edge);
        }

        .key[aria-pressed="true"] {
            color: var(--active);
            border-color: var(--active);
            box-shadow: 0 4px 0 #8a6d00;
        }

        .key[aria-pressed="true"].is-down {
            box-shadow: 0 1px 0 #8a6d00;
        }

        .key:focus-visible {
            outline: 2px solid var(--active);
            outline-offset: 2px;
        }

        .legend-hint {
            width: 100%;
            text-align: center;
            color: var(--hint);
            font-size: 8px;
            line-height: 1.6;
        }

        /* ---------- Mobile NES-style gamepad ---------- */
        :root {
            --pad-body: #c8c8c8;
            --pad-stripe: #2b2b2b;
            --pad-well: #1a1a1a;
            --pad-dpad: #111;
            --pad-dpad-edge: #333;
            --pad-red: #c8102e;
            --pad-red-edge: #7a0a1c;
            --pad-caption: #c8102e;
            /* Sizes scale with the viewport so the pad fits narrow phones. */
            --pad-cell: clamp(24px, 8.5vw, 40px);
            --pad-round: clamp(36px, 11vw, 58px);
            --pad-pill: clamp(26px, 9vw, 48px);
        }

        .pad {
            display: none;
        }

        @media (max-width: 700px), (hover: none) and (pointer: coarse) {
            .legend {
                display: none;
            }

            /* No 2× on mobile; also neutralize it if a hardware key toggled it. */
            .screen.x2 {
                width: 646px;
            }

            /* Pad pinned to the bottom (thumb reach); the screen centers in the space above. */
            body {
                justify-content: flex-start;
                min-height: 100dvh;
                padding-bottom: max(16px, env(safe-area-inset-bottom));
            }

            .screen {
                margin-block: auto;
            }

            #controls {
                display: flex;
                justify-content: center;
                width: 100%;
            }

            /* Three balanced columns: D-pad | MUTE/START | FIRE */
            .pad {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                gap: 8px;
                width: 100%;
                max-width: 520px;
                box-sizing: border-box;
                padding: 16px 12px;
                border-radius: 12px;
                background: var(--pad-body);
                box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25), 0 6px 20px rgba(0, 0, 0, 0.6);
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
            }

            .pad button {
                padding: 0;
                border: 0;
                cursor: pointer;
                touch-action: none;
                -webkit-tap-highlight-color: transparent;
            }

            /* D-pad: a plus sign on a dark square well */
            .pad-dpad {
                display: grid;
                grid-template: repeat(3, var(--pad-cell)) / repeat(3, var(--pad-cell));
                padding: 6px;
                border-radius: 8px;
                background: var(--pad-well);
            }

            .pad-dir,
            .pad-dir-center {
                background: var(--pad-dpad);
                box-shadow: inset 0 0 0 2px var(--pad-dpad-edge);
            }

            .pad-dir.up { grid-area: 1 / 2; border-radius: 4px 4px 0 0; }
            .pad-dir.left { grid-area: 2 / 1; border-radius: 4px 0 0 4px; }
            .pad-dir-center { grid-area: 2 / 2; box-shadow: none; }
            .pad-dir.right { grid-area: 2 / 3; border-radius: 0 4px 4px 0; }
            .pad-dir.down { grid-area: 3 / 2; border-radius: 0 0 4px 4px; }

            /* Arrow notches */
            .pad-dir::after {
                content: "";
                display: block;
                margin: auto;
                width: 0;
                height: 0;
                border: 7px solid transparent;
            }
            .pad-dir.up::after { border-bottom-color: #555; border-top-width: 0; }
            .pad-dir.down::after { border-top-color: #555; border-bottom-width: 0; }
            .pad-dir.left::after { border-right-color: #555; border-left-width: 0; }
            .pad-dir.right::after { border-left-color: #555; border-right-width: 0; }

            .pad-dir.is-down {
                background: #000;
            }
            .pad-dir.is-down::after {
                filter: brightness(1.8);
            }

            .pad-dpad {
                justify-self: start;
            }

            /* FIRE well matches the D-pad well's size (3 cells + 6px padding each side); button centered. */
            .pad-actions {
                justify-self: end;
                box-sizing: border-box;
                width: calc(3 * var(--pad-cell) + 12px);
                height: calc(3 * var(--pad-cell) + 12px);
            }

            /* MUTE / START, with the decorative stripes above them, kept inside the center column */
            .pad-center {
                display: flex;
                justify-content: center;
                gap: 10px;
                align-self: stretch;
                align-items: flex-end;
                padding-bottom: 4px;
                background:
                    linear-gradient(var(--pad-stripe), var(--pad-stripe)) center 22% / 100% 4px no-repeat,
                    linear-gradient(var(--pad-stripe), var(--pad-stripe)) center 40% / 100% 4px no-repeat;
            }

            .pad-pill-group,
            .pad-round-group {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }

            .pad-pill {
                width: var(--pad-pill);
                height: 14px;
                border-radius: 7px;
                background: var(--pad-stripe);
                box-shadow: 0 0 0 4px var(--pad-well), inset 0 -2px 0 #000;
            }

            .pad-pill.is-down {
                transform: translateY(1px);
                box-shadow: 0 0 0 4px var(--pad-well);
            }

            .pad-pill[aria-pressed="true"] {
                background: var(--active);
            }

            .pad-caption {
                color: var(--pad-caption);
                font-size: 8px;
                letter-spacing: 1px;
            }

            /* B / A */
            .pad-actions {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
                padding: 8px;
                border-radius: 10px;
                background: var(--pad-well);
            }

            .pad-actions .pad-caption {
                color: var(--pad-body);
            }

            .pad-round {
                width: var(--pad-round);
                height: var(--pad-round);
                border-radius: 50%;
                background: var(--pad-red);
                box-shadow: inset 0 -4px 0 var(--pad-red-edge), 0 2px 0 #000;
            }

            @media (max-width: 360px) {
                .pad { gap: 4px; padding: 12px 8px; }
                .pad-center { gap: 6px; }
                .pad-caption { font-size: 6px; letter-spacing: 0; }
                .pad-actions { gap: 6px; }
            }

            .pad-round.is-down {
                transform: translateY(2px);
                box-shadow: inset 0 -1px 0 var(--pad-red-edge);
            }
        }

    </style>
</head>
<body>
    <div id="screen-frame" class="screen">
        <canvas id="screen" width="640" height="480"></canvas>
    </div>

    <div id="controls">
        <!-- Desktop: keycap legend -->
        <nav class="legend" aria-label="Game controls">
            <div class="legend-group">
                <span class="legend-label">MOVE</span>
                <button type="button" class="key arrow" data-code="ArrowLeft" aria-label="Move left">←</button>
                <button type="button" class="key arrow" data-code="ArrowRight" aria-label="Move right">→</button>
            </div>
            <div class="legend-group">
                <span class="legend-label">FIRE</span>
                <button type="button" class="key" data-code="Space" aria-label="Fire">SPACE</button>
            </div>
            <div class="legend-group">
                <span class="legend-label">MENU</span>
                <button type="button" class="key arrow" data-code="ArrowUp" aria-label="Menu up">↑</button>
                <button type="button" class="key arrow" data-code="ArrowDown" aria-label="Menu down">↓</button>
            </div>
            <div class="legend-group">
                <span class="legend-label">START / PAUSE</span>
                <button type="button" class="key" data-code="Enter" data-state="pause" aria-label="Start or pause" aria-pressed="false">ENTER</button>
            </div>
            <div class="legend-group">
                <span class="legend-label">MUTE</span>
                <button type="button" class="key" data-code="KeyM" data-state="mute" aria-label="Mute" aria-pressed="false">M</button>
            </div>
            <div class="legend-group">
                <span class="legend-label">2× SIZE</span>
                <button type="button" class="key" data-code="Digit2" data-state="zoom" aria-label="Double size" aria-pressed="false">2</button>
            </div>
            <p class="legend-hint">WASD WORKS TOO · CLICK OR TAP THE KEYS TO PLAY</p>
        </nav>

        <!-- Mobile: NES-style gamepad -->
        <nav class="pad" aria-label="Gamepad">
            <div class="pad-dpad">
                <button type="button" class="pad-dir up" data-code="ArrowUp" aria-label="Up"></button>
                <button type="button" class="pad-dir left" data-code="ArrowLeft" aria-label="Left"></button>
                <span class="pad-dir-center" aria-hidden="true"></span>
                <button type="button" class="pad-dir right" data-code="ArrowRight" aria-label="Right"></button>
                <button type="button" class="pad-dir down" data-code="ArrowDown" aria-label="Down"></button>
            </div>
            <div class="pad-center">
                <div class="pad-pill-group">
                    <button type="button" class="pad-pill" data-code="KeyM" data-state="mute" aria-label="Mute" aria-pressed="false"></button>
                    <span class="pad-caption">MUTE</span>
                </div>
                <div class="pad-pill-group">
                    <button type="button" class="pad-pill" data-code="Enter" data-state="pause" aria-label="Start or pause" aria-pressed="false"></button>
                    <span class="pad-caption">START</span>
                </div>
            </div>
            <div class="pad-actions">
                <div class="pad-round-group">
                    <button type="button" class="pad-round" data-code="Space" aria-label="Fire"></button>
                    <span class="pad-caption">FIRE</span>
                </div>
            </div>
        </nav>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
